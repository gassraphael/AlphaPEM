  variant: Pa_2_5
  source: https://ehgroup.ch/

operating_conditions:
  T_des: 74              # °C. Desired fuel cell temperature.
  Pa_des: 2.5e5          # Pa. Desired pressure of the fuel gas at the anode.
  Pc_des: 2.5e5          # Pa. Desired pressure of the fuel gas at the cathode.
  Sa: 1.2                # Stoichiometric ratio of hydrogen at the anode.
  Sc: 2.0                # Stoichiometric ratio of oxygen at the cathode.
