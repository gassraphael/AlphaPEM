    U_exp: [0.949, 0.867, 0.841, 0.821, 0.807, 0.781, 0.763, 0.746, 0.725, 0.706,
            0.697, 0.687, 0.670, 0.651, 0.630, 0.607, 0.595, 0.566, 0.514]  # V
