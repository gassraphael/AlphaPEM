# ZSW GenStack (2024) T_62 polarization data
#
# Current densities are stored in A/cm² and converted to A/m² at load time.

metadata:
  family: ZSW
  year: 2024
  variant: T_62
  source: https://zenodo.org/records/14223364

operating_conditions:
  T_des: 62          # °C. Desired cooling circuit temperature.
  Pa_des: 2.2e5          # Pa. Desired pressure of the fuel gas at the anode.
  Pc_des: 2.0e5          # Pa. Desired pressure of the fuel gas at the cathode.
  Sa: 1.6                # Stoichiometric ratio of hydrogen at the anode.
  Sc: 1.6                # Stoichiometric ratio of oxygen at the cathode.
  Phi_a_des: 0.398       # Desired relative humidity at the anode.
  Phi_c_des: 0.50        # Desired relative humidity at the cathode.
  y_H2_in: 0.7           # Molar fraction of H2 in the dry anode gas mixture (H2/N2) injected at the inlet.
  i_min_stoich: 0.5      # A/cm². Minimum current density used to compute the desired flows.

pola_exp_data:
  full:
    i_exp: [0.001, 0.050, 0.099, 0.150, 0.199, 0.299, 0.400, 0.498, 0.700, 0.901,
            0.999, 1.099, 1.300, 1.500, 1.700, 1.900, 2.000, 2.200, 2.500]  # A/cm²
    U_exp: [0.944, 0.855, 0.827, 0.808, 0.795, 0.771, 0.754, 0.739, 0.717, 0.696,
            0.685, 0.675, 0.653, 0.631, 0.606, 0.581, 0.566, 0.532, 0.471]  # V
  before_voltage_drop:
    i_exp: [0.001, 0.050, 0.099, 0.150, 0.199, 0.299, 0.400, 0.498, 0.700, 0.901,
            0.999, 1.099, 1.300, 1.500]  # A/cm²
    U_exp: [0.944, 0.855, 0.827, 0.808, 0.795, 0.771, 0.754, 0.739, 0.717, 0.696,
            0.685, 0.675, 0.653, 0.631]  # V

pola_exp_data_calibration:
  full:
    i_exp: [0.001, 0.050, 0.498, 1.500, 2.000, 2.500]  # A/cm²
    U_exp: [0.944, 0.855, 0.739, 0.631, 0.566, 0.471]  # V
  before_voltage_drop:
