    U_exp: [0.936, 0.835, 0.809, 0.795, 0.783, 0.759, 0.741, 0.725, 0.701, 0.670,
            0.661, 0.633, 0.587, 0.541, 0.500, 0.457, 0.437, 0.402]  # V
